<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>coo — Blockwise AI Chat</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-mode="landing">
    <div class="ambient">
      <span class="orb orb-a" aria-hidden="true"></span>
      <span class="orb orb-b" aria-hidden="true"></span>
      <span class="orb orb-c" aria-hidden="true"></span>
    </div>

    <main class="app">
      <header class="hero">
        <button class="logo" type="button" aria-label="Coo home">coo</button>
        <div class="hero-details">
          <div class="hero-copy">
            <h1>Edit AI answers in place.</h1>
            <p>
              coo turns long responses into clean paragraphs you can translate,
              expand, and simplify—right where they appear.
            </p>
          </div>
          <div class="hero-meta">
            <span class="badge">In-context edits</span>
            <span class="badge">Notion-inspired blocks</span>
          </div>
        </div>
      </header>

      <section class="thread-list" aria-label="Artifacts">
        <h2>Artifacts</h2>
        <div id="thread-list" class="thread-list-items"></div>
      </section>

      <section class="chat">
        <div id="thread" class="thread" aria-live="polite"></div>

        <form id="chat-form" class="composer">
          <label class="composer-label" for="prompt">Ask coo anything</label>
          <div class="composer-row">
            <div
              id="prompt"
              class="prompt"
              contenteditable="true"
              role="textbox"
              aria-multiline="true"
              aria-label="Prompt"
              data-placeholder="Try: Draft a product vision for a mindful calendar app."
            ></div>
            <button type="submit" class="send">
              <span>Send</span>
              <span aria-hidden="true">→</span>
            </button>
          </div>
          <div id="blockControls" class="block-controls hidden">
            <button type="button" data-action="translate">Translate</button>
            <button type="button" data-action="example">Example</button>
            <button type="button" data-action="eli5">ELI5</button>
            <button type="button" data-action="expand">Expand</button>
          </div>
          <p class="composer-hint">
            Tip: click a 6-dot handle to focus a paragraph in block mode.
          </p>
        </form>
      </section>
    </main>

    <script id="copy-data" type="application/json">
      {
        "heroHeadline": "Edit AI answers in place.",
        "heroDescription": "coo turns long responses into clean paragraphs you can translate, expand, and simplify—right where they appear.",
        "heroBadges": ["In-context edits", "Notion-inspired blocks"],
        "composerLabel": "Ask coo anything",
        "composerLabelBlock": "Ask about the selected paragraph",
        "composerHint": "Tip: click a 6-dot handle to focus a paragraph in block mode.",
        "promptPlaceholder": "Try: Find a counter argument for that.",
        "prefillPrompt": "Explain Cobb-Douglas function, and how does it describe capital/labour substitution.",
        "blockButtons": {
          "translate": "Translate",
          "eli5": "ELI5",
          "expand": "Expand"
        },
        "userLabel": "You",
        "assistantLabel": "Coo"
      }
    </script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
    ></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
